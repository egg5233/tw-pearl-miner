# tw-pearl-miner HiveOS custom miner manifest
CUSTOM_NAME=tw-pearl-miner
CUSTOM_VERSION=1.9.1
CUSTOM_BUILD=1

# absolute path so h-config.sh (writes) and h-run.sh (reads) agree regardless of CWD
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/tw-pearl-miner/tw-pearl-miner.conf

CUSTOM_LOG_BASENAME=/var/log/miner/tw-pearl-miner/tw-pearl-miner
