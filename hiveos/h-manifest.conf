# tw-pearl-miner HiveOS custom miner manifest
CUSTOM_NAME=tw-pearl-miner
CUSTOM_VERSION=1.2.0
CUSTOM_BUILD=1

# config file h-config.sh writes and h-run.sh reads
CUSTOM_CONFIG_FILENAME=tw-pearl-miner.conf

# log file base (h-run.sh tees to ${CUSTOM_LOG_BASENAME}.log; h-stats.sh parses it)
CUSTOM_LOG_BASENAME=/var/log/miner/tw-pearl-miner/tw-pearl-miner
